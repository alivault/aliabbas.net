<!doctype html>
<!--
  Source of public/og-image.png (1200 × 630), the link preview of the site.
  To render it again: node scripts/og-image.ts (with the dev server on).
  The script draws the world first and sets it as --world.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Michroma';
        src: url('../node_modules/@fontsource/michroma/files/michroma-latin-400-normal.woff2')
          format('woff2');
      }
      * {
        margin: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
      }
      body {
        position: relative;
        overflow: hidden;
        /* The --ground and --hud tokens of src/styles/globals.css. */
        background: oklch(0.2 0.003 60) var(--world) center / cover no-repeat;
        color: oklch(0.6 0.19 37);
        font-family: 'Michroma', sans-serif;
        text-transform: uppercase;
      }
      /* The world darkens behind the text, so it reads. */
      .shade {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          to right,
          oklch(0.121 0.0039 245.5 / 0.7) 0%,
          transparent 55%
        );
      }
      .site {
        position: absolute;
        top: 34px;
        right: 48px;
        font-size: 16px;
        letter-spacing: 0.42em;
      }
      /* The text keeps to the left; the orb is on the right. */
      main {
        position: absolute;
        left: 64px;
        top: 0;
        bottom: 0;
        width: 580px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      h1 {
        font-size: 50px;
        font-weight: 400;
        letter-spacing: 0.3em;
      }
      .role {
        margin-top: 28px;
        font-size: 17px;
        letter-spacing: 0.36em;
        color: oklch(0.915 0.009 94);
      }
      .focus {
        margin-top: 18px;
        font-size: 13px;
        line-height: 2;
        letter-spacing: 0.3em;
        color: oklch(0.915 0.009 94 / 0.7);
      }
    </style>
  </head>
  <body>
    <div class="shade"></div>
    <span class="site">aliabbas.net</span>
    <main>
      <h1>Ali Abbas</h1>
      <p class="role">Senior Frontend Engineer</p>
      <p class="focus">
        Streaming interfaces · state machines<br />
        Motion · accessibility
      </p>
    </main>
  </body>
</html>
